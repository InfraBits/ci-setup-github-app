name: Setup GitHub app access

on:
  workflow_call:
    inputs:
      app_id:
        description: GitHub application id
        type: number
        required: true
      app_key:
        description: GitHub application secret key
        type: string
        required: true
      repo:
        description: GitHub repo path (org/repo)
        type: string
        required: true

    outputs:
      access_token:
        description: GitHub access token
        value: ${{ jobs.setup-access.outputs.access_token }}

jobs:
  setup-access:
    runs-on: ubuntu-latest
    outputs:
      access_token: ${{ steps.setup-github-app.outputs.access_token }}
    steps:
      - name: checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: setup GitHub app
        uses: infrabits/ci-setup-github-app@7fbbffbb86862da745b24d427a8b8b702760c28b # main
        id: setup-github-app
        with:
          app_id: ${{ inputs.app_id }}
          app_key: ${{ inputs.app_key }}
          repo: ${{ inputs.repo }}
